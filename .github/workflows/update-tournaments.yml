name: Update Fortnite tournaments
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/update_tournaments.py
      - name: Commit only when calendar changed
        run: |
          if git diff --quiet -- data/tournaments.json; then
            echo "No tournament changes"
            exit 0
          fi
          git config user.name "fn-compass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tournaments.json
          git commit -m "chore: update Fortnite tournament calendar"
          git push
