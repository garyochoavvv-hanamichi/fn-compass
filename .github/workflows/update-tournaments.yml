name: Update Fortnite tournaments
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/update_tournaments.py'
      - '.github/workflows/update-tournaments.yml'
      - 'requirements.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/update_tournaments.py
      - name: Commit calendar and leaderboard data when changed
        run: |
          git add -N data/tournaments.json data/rankings.json 2>/dev/null || true
          if git diff --quiet -- data/tournaments.json data/rankings.json; then
            echo "No tournament or leaderboard changes"
            exit 0
          fi
          git config user.name "fn-compass-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tournaments.json data/rankings.json
          git commit -m "chore: update Fortnite calendar and leaderboards"
          git push
