name: Build CHOREZA NIGHT TV v4

on:
  push:
    branches:
      - choreza-night-tv-apk
    paths:
      - 'choreza-night-tv/**'
      - '.github/workflows/choreza-night-tv-v4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android TV project
        run: |
          rm -rf ChorezaNightTV
          npx --yes @react-native-community/cli@latest init ChorezaNightTV --template @react-native-tvos/template-tv --skip-git-init
          cp choreza-night-tv/App.tsx ChorezaNightTV/App.tsx

      - name: Install WebRTC and configure capture
        working-directory: ChorezaNightTV
        run: |
          npm install react-native-webrtc@124.0.8 --save --legacy-peer-deps
          sed -i 's/^newArchEnabled=true/newArchEnabled=false/' android/gradle.properties || true
          printf '\nandroid.enableDexingArtifactTransform.desugaring=false\n' >> android/gradle.properties

      - name: Add launcher icon
        run: |
          mkdir -p ChorezaNightTV/android/app/src/main/res/drawable-nodpi
          curl -L --fail             "https://choreza-night.floot.app/_cdn/static/52f673b4-9384-40c9-be55-9cb035438ff8-choreza-night-tv-naruto-hanamichi-icon.png"             -o ChorezaNightTV/android/app/src/main/res/drawable-nodpi/choreza_night_tv_icon.png

      - name: Configure native Android TV features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("ChorezaNightTV/android/app/src/main")
          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()

          text = re.sub(r'android:icon="@[^"]+"', 'android:icon="@drawable/choreza_night_tv_icon"', text)
          text = re.sub(r'android:roundIcon="@[^"]+"', 'android:roundIcon="@drawable/choreza_night_tv_icon"', text)
          text = re.sub(r'android:label="@string/app_name"', 'android:label="CHOREZA NIGHT TV"', text)

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          insert = "\n    " + "\n    ".join([p for p in permissions if p not in text]) + "\n"
          text = text.replace("<application", insert + "    <application", 1)
          manifest.write_text(text)

          # Android 9 compatibility documented by react-native-webrtc:
          # compile app bytecode with Java 8 source semantics and Java 11 target.
          app_gradle = Path("ChorezaNightTV/android/app/build.gradle")
          if app_gradle.exists():
              gradle_text = app_gradle.read_text()
              if "sourceCompatibility JavaVersion.VERSION_1_8" not in gradle_text:
                  gradle_text = gradle_text.replace(
                      "android {",
                      "android {\n"
                      "    compileOptions {\n"
                      "        sourceCompatibility JavaVersion.VERSION_1_8\n"
                      "        targetCompatibility JavaVersion.VERSION_11\n"
                      "    }\n"
                      "    kotlinOptions {\n"
                      "        jvmTarget = \"11\"\n"
                      "    }",
                      1,
                  )
                  app_gradle.write_text(gradle_text)

          mains = list(root.rglob("MainApplication.kt"))
          if not mains:
              raise SystemExit("MainApplication.kt not found")
          main = mains[0]
          source = main.read_text()

          package_match = re.search(r'^package\s+([^\n]+)', source, re.M)
          if not package_match:
              raise SystemExit("Android package not found")
          package_name = package_match.group(1).strip()

          if "ChorezaAudioPackage()" not in source:
              source = source.replace(
                  "PackageList(this).packages.apply {",
                  "PackageList(this).packages.apply {\n        add(ChorezaAudioPackage())",
                  1,
              )
          main.write_text(source)

          activities = list(root.rglob("MainActivity.kt"))
          if not activities:
              raise SystemExit("MainActivity.kt not found")
          activity = activities[0]
          activity_source = activity.read_text()

          if "WebRTCModuleOptions" not in activity_source:
              activity_package = re.search(r'^package\s+([^\n]+)', activity_source, re.M)
              if not activity_package:
                  raise SystemExit("MainActivity package not found")
              pos = activity_package.end()
              activity_source = (
                  activity_source[:pos]
                  + "\n\nimport android.os.Build"
                  + "\nimport android.os.Bundle"
                  + "\nimport com.oney.WebRTCModule.WebRTCModuleOptions"
                  + activity_source[pos:]
              )

          if "enableMediaProjectionService" not in activity_source:
              # RN TV templates extend ReactActivity. This must happen BEFORE
              # super.onCreate so the WebRTC module sees the option before
              # getDisplayMedia initializes.
              if "override fun onCreate(" not in activity_source:
                  class_open = activity_source.find("{", activity_source.find("class MainActivity"))
                  if class_open == -1:
                      raise SystemExit("MainActivity class opening not found")
                  activity_source = (
                      activity_source[:class_open + 1]
                      + "\n  override fun onCreate(savedInstanceState: Bundle?) {"
                      + "\n    WebRTCModuleOptions.getInstance().enableMediaProjectionService ="
                      + "\n      Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q"
                      + "\n    super.onCreate(savedInstanceState)"
                      + "\n  }\n\n"
                      + activity_source[class_open + 1:]
                  )
              else:
                  activity_source = activity_source.replace(
                      "super.onCreate(savedInstanceState)",
                      "WebRTCModuleOptions.getInstance().enableMediaProjectionService =\n"
                      "      Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q\n"
                      "    super.onCreate(savedInstanceState)",
                      1,
                  )
          activity.write_text(activity_source)

          package_dir = root / "java" / Path(package_name.replace(".", "/"))
          package_dir.mkdir(parents=True, exist_ok=True)
          for filename in [
              "ChorezaAudioModule.kt",
              "ChorezaAudioPackage.kt",
              "ChorezaCaptureService.kt",
          ]:
              template = Path("choreza-night-tv/native") / filename
              target = package_dir / filename
              target.write_text(template.read_text().replace("__PACKAGE__", package_name))

          service_decl = """
              <service
                  android:name=".ChorezaCaptureService"
                  android:exported="false"
                  android:foregroundServiceType="mediaProjection|microphone" />
          """
          text = manifest.read_text()
          if "ChorezaCaptureService" not in text:
              text = text.replace("</application>", service_decl + "\n    </application>", 1)
              manifest.write_text(text)
          PY

      - name: Add WebRTC release keep rules
        run: |
          cat >> ChorezaNightTV/android/app/proguard-rules.pro <<'EOF'
          -keep class org.webrtc.** { *; }
          -keep class com.oney.WebRTCModule.** { *; }
          EOF

      - name: Build release APK
        working-directory: ChorezaNightTV
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle             --platform android             --dev false             --entry-file index.js             --bundle-output android/app/src/main/assets/index.android.bundle             --assets-dest android/app/src/main/res
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign and verify APK
        run: |
          set -e
          mkdir -p output
          APK="$(find ChorezaNightTV/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          PASS="$(openssl rand -hex 16)"

          keytool -genkeypair             -keystore /tmp/choreza-v4.keystore             -alias choreza-v4             -keyalg RSA             -keysize 2048             -validity 10000             -storepass "$PASS"             -keypass "$PASS"             -dname "CN=CHOREZA NIGHT TV,O=CHOREZA,C=PE"

          "$ZIPALIGN" -p -f 4 "$APK" /tmp/choreza-v4-aligned.apk
          OUT="output/CHOREZA_NIGHT_TV_v4_FIXED_WEBSTYLE_1080p60.apk"
          "$APKSIGNER" sign             --ks /tmp/choreza-v4.keystore             --ks-key-alias choreza-v4             --ks-pass "pass:$PASS"             --key-pass "pass:$PASS"             --out "$OUT"             /tmp/choreza-v4-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs "$OUT"
          unzip -l "$OUT" | grep -E 'index.android.bundle|assets/index.android.bundle'
          sha256sum "$OUT" > output/SHA256.txt
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CHOREZA-NIGHT-TV-v4
          path: output/*
          if-no-files-found: error
          retention-days: 7
