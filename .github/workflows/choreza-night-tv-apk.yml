name: Build CHOREZA NIGHT TV APK

on:
  push:
    branches:
      - choreza-night-tv-apk
    paths:
      - 'choreza-night-tv/**'
      - '.github/workflows/choreza-night-tv-apk.yml'
  workflow_dispatch:

jobs:
  build-android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create React Native TV project
        run: |
          rm -rf ChorezaNightTV
          npx --yes @react-native-community/cli@latest init ChorezaNightTV --template @react-native-tvos/template-tv --skip-git-init
          cp choreza-night-tv/App.tsx ChorezaNightTV/App.tsx

      - name: Install WebRTC
        working-directory: ChorezaNightTV
        run: |
          npm install react-native-webrtc@latest --save --legacy-peer-deps
          SCREEN_CAPTURE="node_modules/react-native-webrtc/android/src/main/java/com/oney/WebRTCModule/ScreenCaptureController.java"
          if [ -f "$SCREEN_CAPTURE" ]; then
            sed -i 's/private static final int DEFAULT_FPS = 30;/private static final int DEFAULT_FPS = 60;/' "$SCREEN_CAPTURE"
            grep 'DEFAULT_FPS' "$SCREEN_CAPTURE"
          fi
          if [ -f android/gradle.properties ]; then
            sed -i 's/^newArchEnabled=true/newArchEnabled=false/' android/gradle.properties || true
          fi

      - name: Configure MediaProjection and Android TV permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("ChorezaNightTV/android/app/src/main")
          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          insert = "\n    " + "\n    ".join([p for p in permissions if p not in text]) + "\n"
          text = text.replace("<application", insert + "    <application", 1)
          manifest.write_text(text)

          mains = list(root.rglob("MainApplication.kt")) + list(root.rglob("MainApplication.java"))
          if not mains:
              raise SystemExit("MainApplication not found")
          main = mains[0]
          source = main.read_text()

          if main.suffix == ".kt":
              if "WebRTCModuleOptions" not in source:
                  package_match = re.search(r'^package\s+[^\n]+', source, re.M)
                  if not package_match:
                      raise SystemExit("Kotlin package line not found")
                  pos = package_match.end()
                  source = source[:pos] + "\n\nimport com.oney.WebRTCModule.WebRTCModuleOptions" + source[pos:]
              marker = "super.onCreate()"
              if "enableMediaProjectionService = true" not in source:
                  source = source.replace(
                      marker,
                      marker + "\n    WebRTCModuleOptions.getInstance().enableMediaProjectionService = true",
                      1,
                  )
          else:
              if "WebRTCModuleOptions" not in source:
                  package_match = re.search(r'^package\s+[^;]+;', source, re.M)
                  if not package_match:
                      raise SystemExit("Java package line not found")
                  pos = package_match.end()
                  source = source[:pos] + "\n\nimport com.oney.WebRTCModule.WebRTCModuleOptions;" + source[pos:]
              marker = "super.onCreate();"
              if "enableMediaProjectionService = true" not in source:
                  source = source.replace(
                      marker,
                      marker + "\n    WebRTCModuleOptions.getInstance().enableMediaProjectionService = true;",
                      1,
                  )
          # Register the CHOREZA native audio package in the generated TV app.
          if main.suffix == ".kt":
              if "ChorezaAudioPackage()" not in source:
                  source = source.replace(
                      "PackageList(this).packages.apply {",
                      "PackageList(this).packages.apply {\n        add(ChorezaAudioPackage())",
                      1,
                  )
          else:
              # Current TV template is Kotlin; keep a hard failure instead of silently
              # shipping an APK without internal audio on an unexpected Java template.
              raise SystemExit("Expected Kotlin MainApplication for CHOREZA audio package")

          main.write_text(source)

          package_match = re.search(r'^package\s+([^\n]+)', source, re.M)
          if not package_match:
              raise SystemExit("Android package not found")
          package_name = package_match.group(1).strip()
          package_dir = root / "java" / Path(package_name.replace(".", "/"))
          package_dir.mkdir(parents=True, exist_ok=True)

          for filename in [
              "ChorezaAudioModule.kt",
              "ChorezaAudioPackage.kt",
              "ChorezaCaptureService.kt",
          ]:
              template = Path("choreza-night-tv/native") / filename
              target = package_dir / filename
              target.write_text(template.read_text().replace("__PACKAGE__", package_name))

          service_decl = """
              <service
                  android:name=".ChorezaCaptureService"
                  android:exported="false"
                  android:foregroundServiceType="mediaProjection|microphone" />
          """
          text = manifest.read_text()
          if "ChorezaCaptureService" not in text:
              text = text.replace("</application>", service_decl + "\n    </application>", 1)
              manifest.write_text(text)

          print("Configured:", manifest)
          print("Configured:", main)
          print("Native audio package:", package_name)
          PY

      - name: Build standalone release APK
        working-directory: ChorezaNightTV
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare installable APK
        run: |
          mkdir -p output
          APK="$(find ChorezaNightTV/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi
          cp "$APK" output/CHOREZA_NIGHT_TV_v3_STANDALONE_AUDIO_1080p60.apk
          sha256sum output/CHOREZA_NIGHT_TV_v3_STANDALONE_AUDIO_1080p60.apk > output/SHA256.txt
          unzip -l output/CHOREZA_NIGHT_TV_v3_STANDALONE_AUDIO_1080p60.apk | grep -E 'index.android.bundle|assets/index.android.bundle' || {
            echo "Embedded JS bundle missing"
            exit 1
          }
          ls -lh output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHOREZA-NIGHT-TV-APK
          path: output/*
          if-no-files-found: error
          retention-days: 7
